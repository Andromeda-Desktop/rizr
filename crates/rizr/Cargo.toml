[package]
name = "rizr"
description = "One control plane for any project: build, test and run its stack with one command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
rizr-core = { version = "0.1.0", path = "../rizr-core", features = ["clap"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
